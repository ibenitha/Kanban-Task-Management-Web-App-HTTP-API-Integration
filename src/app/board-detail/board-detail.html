@if (board(); as b) {
  <a routerLink="/boards" class="back-link">&larr; All boards</a>
  <h1>{{ b.name }}</h1>
  <p>{{ b.description }}</p>

  <!-- Nested outlet: renders column-list at /boards/:boardId and
       task-detail at /boards/:boardId/tasks/:taskId, right inside this shell. -->
  <router-outlet />
} @else {
  <p>Board not found.</p>
}
