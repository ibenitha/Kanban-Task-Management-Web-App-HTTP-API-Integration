@if (task(); as t) {
  <button type="button" class="back-link" (click)="backToBoard()">&larr; Back to board</button>
  <h1>{{ t.title }}</h1>
  <p class="status">Status: {{ t.status }}</p>

  <label class="field">
    Description
    <!-- ngModel keeps draftDescription in sync as the user types, which is what
         hasUnsavedChanges() compares against the saved value. -->
    <textarea rows="4" [(ngModel)]="draftDescription"></textarea>
  </label>

  <div class="actions">
    <button type="button" (click)="save()" [disabled]="!hasUnsavedChanges()">Save</button>
    @if (hasUnsavedChanges()) {
      <span class="dirty-hint">Unsaved changes — leaving this page will ask for confirmation.</span>
    }
  </div>
} @else {
  <p>Task not found.</p>
}
