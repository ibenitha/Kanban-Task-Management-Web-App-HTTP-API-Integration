<h1>Boards</h1>
<p>Select a board to view its columns and tasks.</p>

<ul class="board-list">
  <!-- routerLink to a dynamic path: Angular fills in the board's id as the :boardId route parameter. -->
  @for (board of boards(); track board.id) {
    <li>
      <a [routerLink]="['/boards', board.id]" class="board-card">
        <h2>{{ board.name }}</h2>
        <p>{{ board.description }}</p>
      </a>
    </li>
  }
</ul>
