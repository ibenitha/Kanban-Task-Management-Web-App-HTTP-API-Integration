<h1>Settings</h1>
<p>This page is protected by <code>authGuard</code> — you must be logged in to see it.</p>

<label class="field">
  Display name
  <input type="text" [ngModel]="displayName()" (ngModelChange)="displayName.set($event); saved.set(false)" />
</label>

<button type="button" (click)="save()" [disabled]="!hasUnsavedChanges()">Save</button>

@if (hasUnsavedChanges()) {
  <p class="dirty-hint">Unsaved changes — try navigating away to see the confirm dialog.</p>
} @else if (saved()) {
  <p class="saved-hint">Saved.</p>
}
